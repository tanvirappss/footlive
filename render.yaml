# Render Blueprint Specification for One-Click Deployment
# https://render.com/docs/blueprints

services:
  - type: web
    name: footlive-streaming-platform
    env: node
    plan: free
    buildCommand: cd admin-dashboard && npm install && npm run build
    startCommand: cd admin-dashboard && npm run start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 10000
